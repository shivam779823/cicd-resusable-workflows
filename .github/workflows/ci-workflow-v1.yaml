name: GitOps CI - {{ github.repository }}

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: './Dockerfile'
      deployment_repo:
        required: true
        type: string
      deployment_branch:
        required: false
        type: string
        default: main
      manifest_path:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.11"
      run_tests:
        required: false
        type: boolean
        default: true
      release_workflow:
        required: false
        type: boolean
        default: false

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      GITOPS_PAT:
        required: true

env:
  dockerhub_username: shiva9921

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write
      

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------
      # 🔍 Secret Scanning (Gitleaks)
      # ----------------------
      # - name: Scan for hardcoded secrets
      #   uses: gitleaks/gitleaks-action@v2
                  
      # - uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITOPS_PAT }}

      # ----------------------
      # 🛡️ SAST (CodeQL)
      # ----------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # ----------------------
      # 🐍 Dependency Vulnerability Scan
      # ----------------------
      - name: Set up Python
        if: inputs.run_tests == true
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        if: inputs.run_tests == true && hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest

      - name: Dependency vulnerability scan
        if: inputs.run_tests == true && hashFiles('requirements.txt') != ''
        run: pip-audit

      - name: Run tests
        if: inputs.run_tests == true
        run: pytest || echo "No tests found"

      # ----------------------
      # 🐳 Build & Push Container
      # ----------------------

      - name: Generate image tag
        id: tag
        run: |-
          echo "IMAGE_TAG=${{ env.dockerhub_username }}/${{ inputs.image_name }}:${{ github.sha }}" >> $GITHUB_OUTPUT

          if [ "${{ inputs.release_workflow }}" = "true" ]; then
            echo "Release workflow enabled - tagging image as latest"
            echo "IMAGE_TAG=${{ env.dockerhub_username }}/${{ inputs.image_name }}:${{github.run_number}}" >> $GITHUB_OUTPUT
          fi


      - name: docker Builder
        run: |-
          echo "logging to the dockerhub"
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

          echo "login success"

      - name: Build and push image
        run: |-
          echo "Building and pushing image ${{ steps.tag.outputs.IMAGE_TAG }}"
          docker build -t ${{ steps.tag.outputs.IMAGE_TAG }} -f ${{ inputs.dockerfile_path }} .
          docker push ${{ steps.tag.outputs.IMAGE_TAG }}
          echo "Build and push successful"


      # ----------------------
      # 📦 SBOM Generation
      # ----------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tag.outputs.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # ----------------------
      # 🔎 Container Image Scan
      # ----------------------
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.IMAGE_TAG }}
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      # ----------------------
      # 📝 Update GitOps Repo (only if all above passed)
      # ----------------------
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.deployment_repo }}
          ref: ${{ inputs.deployment_branch }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Kubernetes manifest image
        run: |
          cd gitops/${{ inputs.manifest_path }}
          echo "Updating image to ${{ steps.tag.outputs.IMAGE_TAG }}"
          sed -i "s|image: .*|image: ${{ steps.tag.outputs.IMAGE_TAG }}|g" deployment.yaml

      - name: Commit and push GitOps change
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Secure update: image → ${{ steps.tag.outputs.IMAGE_TAG }}" || echo "No changes"
          git push


